<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Контакты ведущего Алихана Гергокова">
    <title>Алихан Гергоков — ведущий</title>
    <link rel="stylesheet" href="contactsstyle.css">
</head>
<body>
    <header>
        <div class="header-content">
            <h1>Алихан Гергоков</h1>
        </div> 
    </header>

    <div class="profile-container">
        <img src="profile.png" alt="Алихан Гергоков" class="profile-img">
    </div>

    <div class="description">
        <p class="subtitle">Ведущий мероприятий</p>
        <p class="desc">Свадьбы, корпоративы, юбилеи</p>
    </div>

    <main>
        <article class="contact-card">
            <h2>Контакты</h2>
            <div class="contact-info">
                <div class="phone-numbers">
                    <a href="tel:+79993002169" class="phone" aria-label="Позвонить по номеру +7 999 300-21-69">
                        <img src="phone.png" alt="Иконка телефона">
                        +7 (999) 300-21-69
                    </a>
                    <a href="tel:+79640330033" class="phone" aria-label="Позвонить по номеру +7 964 033-00-33">
                        <img src="phone.png" alt="Иконка телефона">
                        +7 (964) 033-00-33
                    </a>
                </div>

                <div class="social">
                    <a href="https://www.instagram.com/alihan_gergokov" class="instagram" target="_blank" rel="noopener noreferrer">
                        <img src="instagram.png" alt="Иконка Instagram">
                        @alihan_gergokov
                    </a>
                </div>
            </div>
        </article>
    </main>

    <footer>
         <a href="#" id="addContactBtn">Сохранить контакт</a>
         <!-- <p>© 2026</p> -->
    </footer>

    <script>
document.getElementById('addContactBtn').addEventListener('click', function(e) {
    e.preventDefault(); // Отменяем стандартный переход по ссылке

    // Ссылка на ваш vcf-файл
    const vcfUrl = 'contact.vcf'; 
    const fileName = 'Ведущий.vcf';

    fetch(vcfUrl)
        .then(response => response.blob())
        .then(blob => {
            // Создаем "виртуальный" файл с правильным типом
            const file = new File([blob], fileName, { type: 'text/vcard' });
            const url = URL.createObjectURL(file);

            // Создаем невидимую ссылку и "кликаем" по ней
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            
            // Очищаем память
            URL.revokeObjectURL(url);
        });
});
</script>
</body>
</html>
